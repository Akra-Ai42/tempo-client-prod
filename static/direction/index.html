<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo Client - Direction</title>
  <link rel="stylesheet" href="/static/shared/style.css">
  <style>
    body.direction-v2 {
      margin: 0;
      padding: 0;
      background: var(--surface-0);
      min-height: 100vh;
    }
    .direction-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 32px;
    }
    .section-direction {
      margin-bottom: 32px;
    }
    .section-direction .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-direction .section-title-big {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .btn-refresh {
      background: var(--surface-1);
      border: 1px solid var(--border-regular);
      color: var(--text-secondary);
      padding: 6px 14px;
      font-size: 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-refresh:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-switch {
      background: var(--accent);
      color: white;
      border: 1px solid var(--accent);
      padding: 5px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-right: 8px;
      text-decoration: none;
    }
    .btn-switch:hover { background: #223a52; }

    /* ========== Section 1 : Ce qui se passe aujourd hui ========== */

    .narrative-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .narrative-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .narrative-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .narrative-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .narrative-delta {
      font-size: 11px;
      font-weight: 500;
    }
    .narrative-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .narrative-text {
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.5;
      padding-top: 6px;
      border-top: 1px dashed var(--border-subtle);
    }

    .minibars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 54px;
      padding: 2px 0;
    }
    .minibar {
      flex: 1;
      background: var(--border-regular);
      border-radius: 1px;
      transition: height 0.3s;
    }
    .minibar.muted { background: var(--border-regular); }
    .minibar.accent { background: var(--accent); }
    .minibar.danger { background: var(--danger); }
    .minibars-empty {
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 8px 0;
    }

    /* ========== Section 2 : Signaux techniques ========== */

    .signaux-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 12px;
    }
    .signal-small-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .signal-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .signal-value {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .signal-unit {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 400;
      margin-left: 3px;
    }

    .signal-wide-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }
    .signal-wide-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .signal-wide-meta {
      font-size: 11px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }
    .signal-wide-footer {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-subtle);
    }
    .drift-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .drift-feature {
      background: var(--danger);
      color: white;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    .drift-feature-none {
      color: var(--success);
      font-size: 13px;
      font-weight: 500;
    }

    /* ========== Section 3 : Synthese chiffree ========== */

    .kpi-grid-direction {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .kpi-card-direction {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .kpi-card-direction .kpi-head-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .kpi-card-direction .kpi-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .kpi-card-direction .kpi-value.alert { color: var(--danger); }
    .kpi-card-direction .kpi-value.warning { color: var(--highlight); }
    .kpi-card-direction .kpi-value.success { color: var(--success); }
    .kpi-card-direction .kpi-sub-direction {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* ========== Top liste clients (preserve de la version precedente) ========== */

    .top-list {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .top-row {
      display: grid;
      grid-template-columns: 32px 1fr 80px 180px 24px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.08s;
    }
    .top-row:last-child { border-bottom: none; }
    .top-row:hover { background: var(--surface-2); }
    .top-row .rank {
      font-size: 11px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }
    .top-row .top-name {
      color: var(--text-primary);
      font-weight: 500;
    }
    .top-row .top-region {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-left: 8px;
    }
    .top-row .top-score {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .top-row .bar-container {
      height: 6px;
      background: var(--surface-3);
      border-radius: 3px;
      overflow: hidden;
    }
    .top-row .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .top-row .bar-fill.high { background: var(--danger); }
    .top-row .bar-fill.medium { background: var(--highlight); }
    .top-row .bar-fill.low { background: var(--success); }
    .top-row .arrow {
      color: var(--text-quaternary);
      font-size: 12px;
    }

    .loading-state {
      padding: 40px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
    }
  </style>
</head>
<body class="direction-v2">

  <header class="app-topbar-v2">
    <div class="brand">Tempo Client . Direction</div>
    <div class="user-chip">
      <a href="/static/conseiller/index.html" class="btn-switch">Vue conseiller</a>
      <div class="avatar" id="user-avatar">.</div>
      <span id="user-name">.</span>
      <button class="btn-logout" id="logout-btn">Deconnexion</button>
    </div>
  </header>

  <main class="direction-main" id="main-content">
    <div class="loading-state">Chargement du dashboard...</div>
  </main>

  <script src="/static/direction/app.js"></script>
</body>
</html>
