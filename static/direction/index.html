<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo Client . Direction</title>
  <link rel="stylesheet" href="/static/shared/style.css">
  <style>
    body.direction-v2 {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .direction-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px;
    }
    .section-direction { margin-bottom: 22px; }
    .section-direction .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-direction .section-title-big {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border-regular);
      color: var(--text-secondary);
      padding: 5px 12px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-refresh:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-contrast);
    }
    .btn-switch {
      background: var(--accent-soft);
      color: var(--accent-contrast);
      border: 1px solid var(--accent);
      padding: 3px 9px;
      font-size: 10px;
      cursor: pointer;
      margin-right: 8px;
      text-decoration: none;
      font-family: inherit;
    }

    /* Section 1 : courbes */
    .narrative-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .narrative-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 12px;
    }
    .narrative-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .narrative-title {
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .narrative-delta {
      font-size: 10px;
      font-weight: 500;
    }
    .narrative-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .narrative-text {
      font-size: 11px;
      color: var(--text-tertiary);
      line-height: 1.4;
      margin-top: 6px;
    }

    /* Section 2 : signaux */
    .signaux-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .signal-small-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
    }
    .signal-label {
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .signal-value {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }
    .signal-unit {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 400;
      margin-left: 3px;
    }
    .signal-wide-card {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
    }
    .signal-wide-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .signal-wide-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
    }
    .evidently-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 0.05em;
    }
    .evidently-link:hover { text-decoration: underline; }
    .drift-features {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .drift-feature {
      background: rgba(232, 92, 92, 0.15);
      color: var(--danger);
      border: 1px solid rgba(232, 92, 92, 0.4);
      padding: 3px 8px;
      font-size: 11px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
    }
    .drift-feature-none {
      color: var(--success);
      font-size: 12px;
      font-weight: 500;
    }
    .signal-wide-footer {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-style: italic;
    }

    /* Section 3 : synthese KPI */
    .kpi-grid-direction {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .kpi-card-direction {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 12px;
    }
    .kpi-card-direction .kpi-head-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .kpi-card-direction .kpi-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      margin-top: 4px;
    }
    .kpi-card-direction .kpi-value.alert { color: var(--danger); }
    .kpi-card-direction .kpi-value.warning { color: var(--warning); }
    .kpi-card-direction .kpi-value.success { color: var(--success); }
    .kpi-card-direction .kpi-sub-direction {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* Top liste clients */
    .top-list {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
    }
    .top-row {
      display: grid;
      grid-template-columns: 32px 1fr 80px 180px 24px;
      align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
      cursor: pointer;
    }
    .top-row:last-child { border-bottom: none; }
    .top-row:hover { background: var(--surface-3); }
    .top-row .rank {
      font-size: 11px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
    }
    .top-row .top-name {
      color: var(--text-primary);
      font-weight: 500;
    }
    .top-row .top-region {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-left: 8px;
    }
    .top-row .top-score {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .top-row .top-score.urgence-high { color: var(--danger); }
    .top-row .top-score.urgence-medium { color: var(--warning); }
    .top-row .top-score.urgence-low { color: var(--success); }
    .top-row .bar-container {
      height: 5px;
      background: var(--surface-3);
      overflow: hidden;
    }
    .top-row .bar-fill {
      height: 100%;
      transition: width 0.4s ease;
    }
    .top-row .bar-fill.high { background: var(--danger); }
    .top-row .bar-fill.medium { background: var(--warning); }
    .top-row .bar-fill.low { background: var(--success); }
    .top-row .arrow {
      color: var(--text-quaternary);
      font-size: 12px;
    }

    .loading-state {
      padding: 40px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
    }
  </style>
</head>
<body class="direction-v2 dark-mode">

  <header class="app-topbar-v2">
    <div class="brand">Tempo Client . Direction</div>
    <div class="user-chip">
      <a href="/static/conseiller/index.html" class="btn-switch">Vue conseiller</a>
      <div class="avatar" id="user-avatar">.</div>
      <span id="user-name">.</span>
      <button class="btn-logout" id="logout-btn">Deconnexion</button>
    </div>
  </header>

  <main class="direction-main" id="main-content">
    <div class="loading-state">Chargement du dashboard...</div>
  </main>

  <script src="/static/direction/app.js"></script>
</body>
</html>
