<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo Client — Connexion</title>
  <link rel="stylesheet" href="/static/shared/style.css">
</head>
<body>
  <main class="login-container">
    <header class="login-header">
      <h1>Tempo Client</h1>
      <p>Connexion à votre espace</p>
    </header>
    <form id="login-form" class="login-form">
      <label>
        <span>Identifiant</span>
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>
        <span>Mot de passe</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Se connecter</button>
      <p id="login-error" class="error" hidden></p>
    </form>
    <footer class="login-footer">
      <p>Démo — utilisateurs : <code>conseiller_lille</code>, <code>conseiller_marseille</code>, <code>direction</code></p>
      <p>Mot de passe : <code>demo123</code></p>
    </footer>
  </main>
  <script src="/static/shared/login.js"></script>
</body>
</html>
